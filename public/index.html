<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>www 恣意風尚 - SEOUL closet｜韓選衣櫥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="en">www 恣意風尚 - SEOUL closet</span>
      <span class="zh">韓選衣櫥</span>
    </a>
    <nav class="nav">
      <a href="#shop">新品</a>
      <a href="#shop">針織</a>
      <a href="#shop">外套</a>
      <a href="/admin">後台</a>
      <button class="cart-btn" id="openCart">BAG <span id="cartCount">0</span></button>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <div class="kicker">www 恣意風尚 - SEOUL · Taoyuan/TAIPEI</div>
      <h1>把首爾街頭<br/>帶回衣櫥。</h1>
      <p class="sans">精選韓系剪裁與日常可穿的色調。線上選件後填寫姓名、手機與 7-11 門市，我們依序出貨到店取貨。</p>
      <a class="cta" href="#shop">開始逛衣櫥</a>
    </div>
    <div class="hero-visual"></div>
  </section>

  <main class="wrap" id="shop">
    <div class="sec-head">
      <h2>本季衣櫥</h2>
      <span id="countLabel">50 ITEMS</span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>

  <div class="drawer" id="drawer">
    <div class="mask" id="mask"></div>
    <aside class="panel">
      <h2>購物袋</h2>
      <div class="cart-list" id="cartList"></div>
      <div class="checkout">
        <div class="okbox" id="okbox"></div>
        <div class="sum"><span class="sans">合計</span><b id="sum">NT$ 0</b></div>
        <div class="field">
          <label>收件姓名（須與證件相符）</label>
          <input id="name" placeholder="王小明" autocomplete="name" />
        </div>
        <div class="field">
          <label>手機號碼</label>
          <input id="phone" placeholder="0912 345 678" inputmode="tel" />
        </div>
        <div class="field">
          <label>7-11 門市名稱</label>
          <input id="store" placeholder="例如：台北車站門市" />
        </div>
        <button class="primary" id="pay">送出訂單 · 超商取貨</button>
        <p class="hint">目前為貨到門市取貨流程示範。訂單會即時寫入後台，業主可依序出貨。</p>
      </div>
    </aside>
  </div>

  <footer>SEOUL closet｜韓選衣櫥　·　7-11 門市取貨　·　後台 /admin</footer>
  <script src="/js/shop.js"></script>
</body>
</html>
